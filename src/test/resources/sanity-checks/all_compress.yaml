id: all_compress
namespace: sanitychecks.plugin-compress

tasks:
  - id: loop
    type: io.kestra.plugin.core.flow.Loop
    values:
      - archive
      - archive_directory
    tasks:
      - id: subflow
        type: io.kestra.plugin.core.flow.Subflow
        flowId: "{{ item.value }}"
        namespace: "{{ flow.namespace }}"
        