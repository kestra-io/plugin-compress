# Keep test sources out of code scanning results.
#
# paths-ignore only takes effect for interpreted languages and for compiled languages analysed
# WITHOUT building — CodeQL's 'build-mode: none'. That covers the 'actions' job in codeql.yml
# and the GitHub-managed "CodeQL - Code Quality" run, which extracts Java buildless.
#
# It does NOT apply to the java-kotlin job in codeql.yml, which uses 'build-mode: manual'.
# There the build is the filter: that job compiles './gradlew classes' (main sources only), so
# src/test/java never reaches the database in the first place.
paths-ignore:
  - src/test/java
