# CodeQL advanced setup. The analysis itself, and the shared paths-ignore configuration, live in
# kestra-io/actions so every plugin repository scans the same way; only the triggers are local.
#
# See kestra-io/actions/.github/workflows/plugins-codeql.yml for why Java is built rather than
# extracted buildless.
name: "CodeQL"

on:
  push:
    branches:
      - main
      - 'test/**'
  pull_request:
    branches:
      - main
  schedule:
    # Weekly, matching the cadence default setup used.
    - cron: '0 5 * * 1'
  workflow_dispatch: {}

# Reusable workflow permissions can only be maintained or reduced, never elevated, so
# security-events: write has to be granted here for the nested job to start.
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    uses: kestra-io/actions/.github/workflows/plugins-codeql.yml@test/github-coverage-e2e
    with:
      # Matches targetJavaVersion in build.gradle.
      java-version: '21'
      # Test-only: pin the shared config to the same branch as the workflow. Drop this once the
      # branch merges, so the default (…@main) applies.
      codeql-config: 'kestra-io/actions/.github/codeql/codeql-config.yml@test/github-coverage-e2e'
