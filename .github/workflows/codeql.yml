# CodeQL advanced setup.
#
# Default setup analysed Java with build-mode 'none' (buildless extraction), which could not
# resolve the Gradle classpath: only 77% of calls had a call target and 87% of expressions had
# a known type, both under CodeQL's 85% quality threshold. An unresolved classpath means taint
# flow through Kestra core and BouncyCastle types is invisible, so the crypto code in
# AbstractFileCrypt/FileEncrypt/FileDecrypt was the least reliably scanned part of the plugin.
#
# Here Java is extracted from a real Gradle build (build-mode 'manual'), so the database has the
# full dependency classpath. 'actions' stays buildless — it has no classpath to resolve.
name: "CodeQL"

on:
  push:
    branches:
      - main
      - 'test/**'
  pull_request:
    branches:
      - main
  schedule:
    # Weekly, matching the cadence default setup used.
    - cron: '0 5 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Wider than the 'default' suite default setup used. Use 'security-and-quality'
          # instead to also pull in the maintainability queries.
          queries: security-extended
          # paths-ignore for the buildless 'actions' job; a no-op for built Java.
          config-file: ./.github/codeql/codeql-config.yml

      # Java only: build so CodeQL traces compilation and records the resolved classpath.
      - name: Set up JDK
        if: matrix.build-mode == 'manual'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          # Matches targetJavaVersion in build.gradle.
          java-version: '21'

      - name: Setup Gradle
        if: matrix.build-mode == 'manual'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # classes, not testClasses: with build-mode 'manual' the traced build IS the path filter,
      # so compiling main sources only is what keeps src/test/java out of the database.
      # paths-ignore cannot do this for a built language.
      - name: Build with Gradle
        if: matrix.build-mode == 'manual'
        run: ./gradlew classes --no-daemon --console=plain
        env:
          JAVA_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=1g"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
